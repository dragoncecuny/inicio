<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Avisos por Materia · CECUNY</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #d9d0c1;
            background-image: radial-gradient(circle at 10% 20%, rgba(200, 180, 150, 0.2) 0%, transparent 50%),
                              repeating-linear-gradient(45deg, rgba(180, 160, 130, 0.05) 0px, rgba(180, 160, 130, 0.05) 2px, transparent 2px, transparent 8px);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1400px;
            width: 100%;
            background: #f2ebe1;
            border-radius: 16px 16px 8px 8px;
            padding: 35px;
            box-shadow: 0 8px 0 #b09a82, 0 20px 40px -8px rgba(0, 0, 0, 0.3);
            border: 1px solid #cbb9a4;
            position: relative;
        }
        .container::before {
            content: "𒊹 🌴";
            position: absolute;
            top: -18px;
            left: 30px;
            font-size: 2rem;
            background: #f2ebe1;
            padding: 0 12px;
            border-radius: 40px;
            border: 1px solid #cbb9a4;
            box-shadow: 0 2px 0 #b09a82;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .dragon-flotante { display: inline-block; animation: flotar 3s ease-in-out infinite; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 3px solid #cbb9a4;
            padding-bottom: 20px;
        }
        .header-titulo { display: flex; align-items: center; gap: 15px; }
        .header-titulo .dragon-icon { font-size: 2.8rem; line-height: 1; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1)); }
        .header-titulo h1 { font-family: 'Merriweather', serif; font-size: 2rem; font-weight: 900; color: #3a2c1e; line-height: 1.2; }
        .header-titulo h1 span { font-weight: 400; font-style: italic; color: #6b5b4a; font-size: 1.1rem; display: block; }
        .header-derecha { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .badge { background: #cbb9a4; color: #2d241a; padding: 8px 18px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; border: 1px solid #b09a82; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); }
        .btn-refresh { background: #3a2c1e; color: #f2ebe1; border: none; padding: 10px 22px; border-radius: 40px; font-weight: 700; cursor: pointer; transition: 0.15s ease; font-family: 'Inter', sans-serif; font-size: 0.85rem; box-shadow: 0 4px 0 #1f160e; border: 1px solid #5a4a33; }
        .btn-refresh:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #1f160e; background: #5a4a33; }
        .filters { background: #e8ddd0; padding: 16px 24px; border-radius: 60px; margin-bottom: 30px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; border: 2px solid #cbb9a4; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 0 #b09a82; }
        .filters label { font-weight: 700; color: #3a2c1e; font-family: 'Merriweather', serif; }
        .filters input { padding: 10px 20px; border: 2px solid #cbb9a4; border-radius: 40px; font-size: 0.95rem; background: #faf7f2; outline: none; font-family: 'Inter', sans-serif; color: #2d241a; flex: 1; min-width: 180px; transition: 0.15s ease; }
        .filters input:focus { border-color: #6b5b4a; box-shadow: 0 0 0 4px rgba(60,42,30,0.08); }
        .grid-materias { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; }
        .card-materia { background: #faf7f2; border-radius: 12px 12px 8px 8px; padding: 24px; box-shadow: 0 6px 0 #b09a82, 0 8px 16px rgba(0,0,0,0.08); border: 1px solid #cbb9a4; transition: 0.15s ease; position: relative; }
        .card-materia::after { content: "📚"; position: absolute; bottom: 8px; right: 12px; font-size: 1.8rem; opacity: 0.06; transform: rotate(-5deg); }
        .card-materia:hover { transform: translateY(-4px); box-shadow: 0 10px 0 #b09a82, 0 16px 24px rgba(0,0,0,0.1); }
        .card-materia .nombre-materia { font-family: 'Merriweather', serif; font-size: 1.3rem; font-weight: 700; color: #2d241a; padding-bottom: 14px; border-bottom: 3px solid #cbb9a4; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
        .card-materia .nombre-materia .avatar { width: 44px; height: 44px; border-radius: 50%; background: #6b5b4a; color: #f2ebe1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; flex-shrink: 0; font-family: 'Merriweather', serif; border: 2px solid #b09a82; }
        .card-materia .docente { font-size: 0.95rem; color: #6b5b4a; margin-bottom: 16px; font-weight: 600; }
        .card-materia .docente strong { color: #3a2c1e; }
        .card-materia .btn-pdf { background: #3a2c1e; color: #f2ebe1; border: none; padding: 12px 20px; border-radius: 40px; font-weight: 700; cursor: pointer; transition: 0.15s ease; font-family: 'Inter', sans-serif; font-size: 0.95rem; box-shadow: 0 4px 0 #1f160e; border: 1px solid #5a4a33; width: 100%; margin-bottom: 16px; }
        .card-materia .btn-pdf:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #1f160e; background: #5a4a33; }
        .card-materia .btn-pdf:active { transform: translateY(2px); box-shadow: 0 2px 0 #1f160e; }
        .card-materia .aviso { background: #e8ddd0; border-radius: 12px; padding: 14px 16px; border-left: 4px solid #b09a82; font-size: 0.92rem; color: #2d241a; line-height: 1.5; }
        .card-materia .aviso strong { color: #3a2c1e; }
        #loading { text-align: center; padding: 80px 20px; background: #e8ddd0; border-radius: 16px; font-size: 1.1rem; color: #3a2c1e; font-weight: 700; border: 2px dashed #b09a82; font-family: 'Merriweather', serif; }
        .empty-state { text-align: center; padding: 60px 20px; background: #e8ddd0; border-radius: 16px; grid-column: 1 / -1; border: 2px dashed #b09a82; }
        .empty-state .emoji { font-size: 3.5rem; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Merriweather', serif; color: #2d241a; margin-bottom: 6px; }
        .empty-state p { color: #6b5b4a; }
        @media (max-width: 640px) { body { padding: 16px; } .container { padding: 20px; } .header { flex-direction: column; align-items: flex-start; } .header-titulo h1 { font-size: 1.6rem; } .grid-materias { grid-template-columns: 1fr; } .filters { flex-direction: column; border-radius: 30px; } .filters input { width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-titulo">
                <span class="dragon-icon dragon-flotante">🐉</span>
                <div>
                    <h1>CECUNY <span>Avisos por materia · Dragones que generan cultura</span></h1>
                </div>
            </div>
            <div class="header-derecha">
                <span class="badge">🔄 Actualizado: <strong id="updateTime">cargando...</strong></span>
                <button class="btn-refresh" onclick="cargarAvisos()">⟳ Actualizar</button>
            </div>
        </div>

        <div class="filters">
            <label for="buscador">🔍 Buscar materia:</label>
            <input type="text" id="buscador" placeholder="Nombre de la materia...">
        </div>

        <div id="loading">⏳ Cargando avisos...</div>
        <div id="contenedorAvisos" style="display: none;">
            <div class="grid-materias" id="gridAvisos"></div>
        </div>
    </div>

    <script>
        // ================================================================
        //  CONFIGURACIÓN: Enlace a tu Google Sheet CSV
        // ================================================================
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR1WOBufA55srOZcdEippuYyDSGsBsd-OT_jik6xdwVowgbT_id_7NXGC4Qmu7DpB54P-4j6gPKP9__/pub?gid=0&single=true&output=csv";

        let datosMaterias = [];
        const loadingDiv = document.getElementById('loading');
        const contenedorAvisos = document.getElementById('contenedorAvisos');
        const gridAvisos = document.getElementById('gridAvisos');
        const buscador = document.getElementById('buscador');
        const updateTimeSpan = document.getElementById('updateTime');

        // ================================================================
        //  FUNCIONES
        // ================================================================
        function parseCSV(csvText) {
            const lines = csvText.split(/\r\n|\n/);
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const values = lines[i].split(',').map(v => v.trim());
                const obj = {};
                headers.forEach((h, idx) => { obj[h] = values[idx] || ''; });
                result.push(obj);
            }
            return result;
        }

        function convertirAEnlaceDirecto(url) {
            if (!url) return '';
            // Si ya es enlace directo de Google Drive, lo convertimos
            if (url.includes('drive.google.com/file/d/')) {
                const match = url.match(/\/d\/(.+?)\/(view|edit)/);
                if (match) {
                    return `https://drive.google.com/uc?export=download&id=${match[1]}`;
                }
            }
            return url;
        }

        // ================================================================
        //  CARGAR Y RENDERIZAR
        // ================================================================
        async function cargarAvisos() {
            try {
                loadingDiv.style.display = 'block';
                contenedorAvisos.style.display = 'none';
                loadingDiv.innerHTML = '⏳ Cargando avisos...';

                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Error al cargar los datos');
                const csvText = await response.text();
                const rawData = parseCSV(csvText);
                if (rawData.length === 0) throw new Error('No hay datos en el CSV.');

                // Detectar columnas automáticamente
                const headers = Object.keys(rawData[0]);
                const colMateria = headers.find(h => /materia|asignatura/i.test(h)) || headers[0];
                const colDocente = headers.find(h => /docente|maestro|profesor/i.test(h)) || headers[1];
                const colPDF = headers.find(h => /pdf|url|enlace/i.test(h)) || headers[2];
                const colAviso = headers.find(h => /aviso|nota|mensaje/i.test(h)) || headers[3];

                datosMaterias = rawData.map(row => {
                    const materia = (row[colMateria] || '').trim();
                    if (!materia) return null;

                    return {
                        materia: materia,
                        docente: (row[colDocente] || '').trim(),
                        pdf: convertirAEnlaceDirecto(row[colPDF] || ''),
                        aviso: (row[colAviso] || '').trim(),
                        _search: materia.toLowerCase()
                    };
                }).filter(d => d !== null);

                if (datosMaterias.length === 0) throw new Error('No se encontraron materias.');

                datosMaterias.sort((a, b) => a.materia.localeCompare(b.materia));

                renderAvisos(datosMaterias);
                updateTimeSpan.textContent = new Date().toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' });

                loadingDiv.style.display = 'none';
                contenedorAvisos.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                loadingDiv.innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">❌</span>
                        <h3>Error al cargar los datos</h3>
                        <p style="color:#7a1f1f;">${error.message}</p>
                        <br>
                        <button onclick="cargarAvisos()" style="padding:10px 30px; border-radius:30px; border:none; background:#3a2c1e; color:#f2ebe1; font-weight:600; cursor:pointer;">🔄 Reintentar</button>
                    </div>
                `;
            }
        }

        function renderAvisos(materias) {
            const terminoBusqueda = buscador.value.toLowerCase().trim();
            let filtrados = materias.filter(d => d._search.includes(terminoBusqueda));

            if (filtrados.length === 0) {
                gridAvisos.innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">🔍</span>
                        <h3>No se encontraron materias</h3>
                        <p>Intenta con otro nombre.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtrados.forEach(item => {
                const inicial = item.materia.charAt(0).toUpperCase();

                html += `
                    <div class="card-materia">
                        <div class="nombre-materia">
                            <span class="avatar">${inicial}</span>
                            ${item.materia}
                        </div>
                        <div class="docente"><strong>👩‍🏫 Docente:</strong> ${item.docente || 'No especificado'}</div>
                        ${item.pdf ? `<button class="btn-pdf" onclick="descargarPDF('${item.pdf}')">📄 Descargar materiales</button>` : ''}
                        ${item.aviso ? `<div class="aviso"><strong>📌 Aviso:</strong> ${item.aviso}</div>` : ''}
                    </div>
                `;
            });

            gridAvisos.innerHTML = html;
        }

        function descargarPDF(url) {
            if (!url) return;
            window.open(url, '_blank');
        }

        buscador.addEventListener('input', () => renderAvisos(datosMaterias));

        // Iniciar
        cargarAvisos();
    </script>
</body>
</html>
