<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos · CECUNY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --rojo-creatividad: #E63946;
            --verde-integral: #2A9D8F;
            --azul-especifico: #1D3557;
            --acento: #6A4C93;
            --acento-suave: #E8DDF0;
            --acento-oscuro: #4A3468;
            --texto-principal: #3D2C2E;
            --texto-suave: #6B5B5D;
            --amarillo-prioridad: #F4A261;
            --rojo-prioridad: #E63946;
            --verde-prioridad: #2A9D8F;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #F5EEF8 0%, #FFF9F2 100%);
            background-attachment: fixed;
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(106, 76, 147, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .boton-regreso {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--acento-suave);
            color: var(--acento-oscuro);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .boton-regreso:hover {
            background: var(--acento);
            color: white;
            transform: translateX(-4px);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }
        .encabezado .dragon {
            font-size: 45px;
            display: block;
            margin-bottom: 8px;
            animation: flotar 3s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .encabezado h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: var(--acento);
            margin-bottom: 6px;
        }
        .encabezado .subtitulo {
            font-size: 16px;
            color: var(--texto-suave);
            font-weight: 600;
            background: var(--acento-suave);
            display: inline-block;
            padding: 5px 18px;
            border-radius: 25px;
        }

        /* Filtros */
        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .filtro-btn {
            background: white;
            border: 2px solid var(--acento-suave);
            color: var(--acento-oscuro);
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filtro-btn:hover {
            background: var(--acento-suave);
        }
        .filtro-btn.activo {
            background: var(--acento);
            color: white;
            border-color: var(--acento);
        }

        /* Tarjetas de aviso */
        .aviso {
            background: white;
            border-radius: 20px;
            padding: 22px 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(106, 76, 147, 0.08);
            border-left: 6px solid var(--acento);
        }
        .aviso.prioridad-alta { border-left-color: var(--rojo-prioridad); }
        .aviso.prioridad-media { border-left-color: var(--amarillo-prioridad); }
        .aviso.prioridad-baja { border-left-color: var(--verde-prioridad); }

        .aviso-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .aviso-titulo {
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            color: var(--texto-principal);
        }
        .aviso-fecha {
            font-size: 13px;
            color: var(--texto-suave);
            font-weight: 600;
        }
        .aviso-contenido {
            font-size: 15px;
            color: var(--texto-principal);
            margin-bottom: 12px;
        }
        .aviso-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .etiqueta {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .etiqueta-tipo { background: #E8DDF0; color: var(--acento-oscuro); }
        .etiqueta-destinatario { background: #D6E2F0; color: var(--azul-especifico); }
        .etiqueta-prioridad-alta { background: #FDE8E8; color: #721C24; }
        .etiqueta-prioridad-media { background: #FFF3E0; color: #7B4A1E; }
        .etiqueta-prioridad-baja { background: #E3F0E3; color: #155724; }

        .boton-archivo {
            display: inline-block;
            background: var(--acento);
            color: white;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .boton-archivo:hover {
            background: var(--acento-oscuro);
        }

        .estado {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
            font-weight: 600;
        }
        .estado.error { color: var(--acento); }

        .pie {
            margin-top: 35px;
            text-align: center;
            font-size: 13px;
            color: var(--texto-suave);
            border-top: 2px solid var(--acento-suave);
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .contenedor { padding: 25px 16px; border-radius: 28px; }
            .encabezado h1 { font-size: 28px; }
            .aviso { padding: 16px; }
            .aviso-titulo { font-size: 17px; }
        }
    </style>
</head>
<body>

    <div class="contenedor">

        <a href="index.html" class="boton-regreso">← Volver al inicio</a>

        <div class="encabezado">
            <span class="dragon">🐉</span>
            <h1>Avisos</h1>
            <div class="subtitulo">Ciclo 2026-2027</div>
        </div>

        <div class="filtros" id="filtros">
            <!-- Los filtros se generan dinámicamente con JavaScript -->
        </div>

        <div id="contenido">
            <div class="estado">Cargando avisos...</div>
        </div>

        <div class="pie">
            Centro Cultural de la Niñez Yucateca · Ciclo 2026-2027
        </div>

    </div>

    <script>
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZq-TaatLsqJ2SleHhcpgoWZ3LLbHvh-vCvVuqyK0H0rlQAUfZWFON3abvTF1c7b5w5rvLKIeH6AaY/pub?gid=1058000817&single=true&output=csv';

        let todosLosAvisos = [];
        let filtroActual = { tipo: 'todos', destinatario: 'todos' };

        async function cargarAvisos() {
            const contenedor = document.getElementById('contenido');
            try {
                const respuesta = await fetch(URL_CSV);
                if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);

                const texto = await respuesta.text();
                const textoLimpio = texto.replace(/^\uFEFF/, '').trim();
                if (!textoLimpio) throw new Error('El CSV está vacío');

                const filas = parseCSV(textoLimpio);
                if (filas.length < 2) throw new Error('El CSV no tiene suficientes filas');

                // Columnas esperadas: Fecha, Tipo, Título, Contenido, Destinatario, Prioridad, Archivo
                const datos = filas.slice(1).filter(f => f.length > 1 && f[2]?.trim());

                todosLosAvisos = datos.map(fila => ({
                    fecha: fila[0]?.trim() || '',
                    tipo: fila[1]?.trim() || '',
                    titulo: fila[2]?.trim() || '',
                    contenido: fila[3]?.trim() || '',
                    destinatario: fila[4]?.trim() || '',
                    prioridad: fila[5]?.trim() || '',
                    archivo: fila[6]?.trim() || ''
                }));

                generarFiltros();
                renderizarAvisos();

            } catch (error) {
                contenedor.innerHTML = `<div class="estado error">
                    No se pudieron cargar los avisos.<br>
                    <small>Error: ${error.message}</small><br><br>
                    <small>Verifica que la URL del CSV sea correcta y que la hoja esté publicada como "Valores separados por comas".</small>
                </div>`;
                console.error('Error al cargar avisos:', error);
            }
        }

        function generarFiltros() {
            const filtros = document.getElementById('filtros');
            const tiposUnicos = [...new Set(todosLosAvisos.map(a => a.tipo).filter(Boolean))];
            const destinatariosUnicos = [...new Set(todosLosAvisos.map(a => a.destinatario).filter(Boolean))];

            let html = '';
            html += `<button class="filtro-btn activo" data-tipo="todos" data-destinatario="todos">Todos</button>`;
            tiposUnicos.forEach(tipo => {
                html += `<button class="filtro-btn" data-tipo="${tipo}" data-destinatario="todos">${tipo}</button>`;
            });
            destinatariosUnicos.forEach(dest => {
                html += `<button class="filtro-btn" data-tipo="todos" data-destinatario="${dest}">${dest}</button>`;
            });
            filtros.innerHTML = html;

            filtros.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filtros.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
                    btn.classList.add('activo');
                    filtroActual.tipo = btn.dataset.tipo;
                    filtroActual.destinatario = btn.dataset.destinatario;
                    renderizarAvisos();
                });
            });
        }

        function renderizarAvisos() {
            const contenedor = document.getElementById('contenido');
            let avisosFiltrados = todosLosAvisos;

            if (filtroActual.tipo !== 'todos') {
                avisosFiltrados = avisosFiltrados.filter(a => a.tipo === filtroActual.tipo);
            }
            if (filtroActual.destinatario !== 'todos') {
                avisosFiltrados = avisosFiltrados.filter(a => a.destinatario === filtroActual.destinatario);
            }

            if (avisosFiltrados.length === 0) {
                contenedor.innerHTML = `<div class="estado">No hay avisos para este filtro.</div>`;
                return;
            }

            let html = '';
            avisosFiltrados.forEach(aviso => {
                const prioridadClase = aviso.prioridad?.toLowerCase().includes('alta') ? 'prioridad-alta' :
                                      aviso.prioridad?.toLowerCase().includes('media') ? 'prioridad-media' :
                                      aviso.prioridad?.toLowerCase().includes('baja') ? 'prioridad-baja' : '';
                const prioridadEtiqueta = aviso.prioridad?.toLowerCase().includes('alta') ? 'etiqueta-prioridad-alta' :
                                         aviso.prioridad?.toLowerCase().includes('media') ? 'etiqueta-prioridad-media' :
                                         aviso.prioridad?.toLowerCase().includes('baja') ? 'etiqueta-prioridad-baja' : '';
                html += `<div class="aviso ${prioridadClase}">
                    <div class="aviso-header">
                        <div class="aviso-titulo">${aviso.titulo}</div>
                        <div class="aviso-fecha">${aviso.fecha}</div>
                    </div>
                    <div class="aviso-contenido">${aviso.contenido}</div>
                    <div class="aviso-meta">
                        <span class="etiqueta etiqueta-tipo">${aviso.tipo}</span>
                        <span class="etiqueta etiqueta-destinatario">${aviso.destinatario}</span>
                        ${aviso.prioridad ? `<span class="etiqueta ${prioridadEtiqueta}">Prioridad ${aviso.prioridad}</span>` : ''}
                        ${aviso.archivo ? `<a href="${aviso.archivo}" target="_blank" class="boton-archivo">Ver archivo</a>` : ''}
                    </div>
                </div>`;
            });
            contenedor.innerHTML = html;
        }

        function parseCSV(texto) {
            const filas = [];
            let fila = [];
            let celda = '';
            let entreComillas = false;

            for (let i = 0; i < texto.length; i++) {
                const c = texto[i];
                const siguiente = texto[i + 1];

                if (entreComillas) {
                    if (c === '"' && siguiente === '"') { celda += '"'; i++; }
                    else if (c === '"') { entreComillas = false; }
                    else { celda += c; }
                } else {
                    if (c === '"') { entreComillas = true; }
                    else if (c === ',') { fila.push(celda); celda = ''; }
                    else if (c === '\n' || (c === '\r' && siguiente === '\n')) {
                        if (c === '\r') i++;
                        fila.push(celda); celda = '';
                        if (fila.some(f => f.trim())) filas.push(fila);
                        fila = [];
                    } else if (c !== '\r') { celda += c; }
                }
            }
            if (celda || fila.length) {
                fila.push(celda);
                if (fila.some(f => f.trim())) filas.push(fila);
            }
            return filas;
        }

        cargarAvisos();
    </script>

</body>
</html>
