<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos e invitaciones · CECUNY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --acento: #6A4C93;
            --acento-suave: #E8DDF0;
            --acento-oscuro: #4A3468;
            --texto-principal: #3D2C2E;
            --texto-suave: #6B5B5D;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #F5EEF8 0%, #FFF9F2 100%);
            background-attachment: fixed;
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(106, 76, 147, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .boton-regreso {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--acento-suave);
            color: var(--acento-oscuro);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .boton-regreso:hover {
            background: var(--acento);
            color: white;
            transform: translateX(-4px);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }
        .encabezado .dragon {
            font-size: 45px;
            display: block;
            margin-bottom: 8px;
            animation: flotar 3s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .encabezado h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: var(--acento);
            margin-bottom: 6px;
        }
        .encabezado .subtitulo {
            font-size: 16px;
            color: var(--texto-suave);
            font-weight: 600;
            background: var(--acento-suave);
            display: inline-block;
            padding: 5px 18px;
            border-radius: 25px;
        }

        .aviso {
            background: white;
            border-radius: 20px;
            padding: 22px 24px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(106, 76, 147, 0.08);
            border-left: 6px solid var(--acento);
        }
        .aviso-fecha {
            font-size: 13px;
            color: var(--texto-suave);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .aviso-titulo {
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            color: var(--texto-principal);
            margin-bottom: 8px;
        }
        .aviso-contenido {
            font-size: 16px;
            color: var(--texto-principal);
            margin-bottom: 12px;
        }
        .boton-archivo {
            display: inline-block;
            background: var(--acento);
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .boton-archivo:hover {
            background: var(--acento-oscuro);
        }

        .estado {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
            font-weight: 600;
        }
        .estado.error { color: var(--acento); }

        .pie {
            margin-top: 35px;
            text-align: center;
            font-size: 13px;
            color: var(--texto-suave);
            border-top: 2px solid var(--acento-suave);
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .contenedor { padding: 25px 16px; border-radius: 28px; }
            .encabezado h1 { font-size: 28px; }
            .aviso { padding: 18px; }
            .aviso-titulo { font-size: 19px; }
        }
    </style>
</head>
<body>

    <div class="contenedor">

        <a href="index.html" class="boton-regreso">← Volver al inicio</a>

        <div class="encabezado">
            <span class="dragon">🐉</span>
            <h1>Avisos e invitaciones</h1>
            <div class="subtitulo">Ciclo 2026-2027</div>
        </div>

        <div id="contenido">
            <div class="estado">Cargando avisos...</div>
        </div>

        <div class="pie">
            Centro Cultural de la Niñez Yucateca · Ciclo 2026-2027
        </div>

    </div>

    <script>
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZq-TaatLsqJ2SleHhcpgoWZ3LLbHvh-vCvVuqyK0H0rlQAUfZWFON3abvTF1c7b5w5rvLKIeH6AaY/pub?gid=1058000817&single=true&output=csv';

        async function cargarAvisos() {
            const contenedor = document.getElementById('contenido');
            try {
                const respuesta = await fetch(URL_CSV);
                if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);

                const texto = await respuesta.text();
                const textoLimpio = texto.replace(/^\uFEFF/, '').trim();
                if (!textoLimpio) throw new Error('El CSV está vacío');

                const filas = parseCSV(textoLimpio);
                if (filas.length < 2) throw new Error('El CSV no tiene suficientes filas');

                // Columnas: Fecha, Título, Contenido, Archivo
                const datos = filas.slice(1).filter(f => f.length > 1 && f[1]?.trim());

                let html = '';
                datos.forEach(fila => {
                    const fecha = fila[0]?.trim() || '';
                    const titulo = fila[1]?.trim() || '';
                    const contenido = fila[2]?.trim() || '';
                    const archivo = fila[3]?.trim() || '';

                    html += `<div class="aviso">
                        <div class="aviso-fecha">${fecha}</div>
                        <div class="aviso-titulo">${titulo}</div>
                        <div class="aviso-contenido">${contenido}</div>
                        ${archivo ? `<a href="${archivo}" target="_blank" class="boton-archivo">Ver archivo</a>` : ''}
                    </div>`;
                });

                if (!html) throw new Error('No se encontraron avisos para mostrar');

                contenedor.innerHTML = html;

            } catch (error) {
                contenedor.innerHTML = `<div class="estado error">
                    No se pudieron cargar los avisos.<br>
                    <small>Error: ${error.message}</small><br><br>
                    <small>Verifica que la URL del CSV sea correcta y que la hoja esté publicada como "Valores separados por comas".</small>
                </div>`;
                console.error('Error al cargar avisos:', error);
            }
        }

        function parseCSV(texto) {
            const filas = [];
            let fila = [];
            let celda = '';
            let entreComillas = false;

            for (let i = 0; i < texto.length; i++) {
                const c = texto[i];
                const siguiente = texto[i + 1];

                if (entreComillas) {
                    if (c === '"' && siguiente === '"') { celda += '"'; i++; }
                    else if (c === '"') { entreComillas = false; }
                    else { celda += c; }
                } else {
                    if (c === '"') { entreComillas = true; }
                    else if (c === ',') { fila.push(celda); celda = ''; }
                    else if (c === '\n' || (c === '\r' && siguiente === '\n')) {
                        if (c === '\r') i++;
                        fila.push(celda); celda = '';
                        if (fila.some(f => f.trim())) filas.push(fila);
                        fila = [];
                    } else if (c !== '\r') { celda += c; }
                }
            }
            if (celda || fila.length) {
                fila.push(celda);
                if (fila.some(f => f.trim())) filas.push(fila);
            }
            return filas;
        }

        cargarAvisos();
    </script>

</body>
</html>
