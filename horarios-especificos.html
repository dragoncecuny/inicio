<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Específicos · CECUNY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --azul-especifico: #1D3557;
            --azul-suave: #D6E2F0;
            --azul-oscuro: #0B1D33;
            --crema-fondo: #FFF9F2;
            --texto-principal: #3D2C2E;
            --texto-suave: #6B5B5D;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #D6E2F0 0%, #E8EEF7 50%, #FFF9F2 100%);
            background-attachment: fixed;
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(29, 53, 87, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .boton-regreso {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--azul-suave);
            color: var(--azul-oscuro);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .boton-regreso:hover {
            background: var(--azul-especifico);
            color: white;
            transform: translateX(-4px);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }
        .encabezado .dragon {
            font-size: 45px;
            display: block;
            margin-bottom: 8px;
            animation: flotar 3s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .encabezado h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: var(--azul-especifico);
            margin-bottom: 6px;
        }
        .encabezado .subtitulo {
            font-size: 16px;
            color: var(--texto-suave);
            font-weight: 600;
            background: var(--azul-suave);
            display: inline-block;
            padding: 5px 18px;
            border-radius: 25px;
        }

        .bloque-titulo {
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            color: var(--azul-oscuro);
            margin: 30px 0 12px 0;
            padding-left: 12px;
            border-left: 6px solid var(--azul-especifico);
        }

        .tabla-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(29, 53, 87, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 15px;
        }

        thead {
            background: var(--azul-especifico);
            color: white;
        }

        th {
            padding: 14px 12px;
            text-align: left;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #E4EEF7;
        }

        tbody tr:hover {
            background: #F5F9FD;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .docente {
            font-weight: 600;
            color: var(--azul-oscuro);
        }

        .taller {
            font-weight: 500;
        }

        .estado {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
            font-weight: 600;
        }
        .estado.error {
            color: var(--azul-especifico);
        }

        .pie {
            margin-top: 35px;
            text-align: center;
            font-size: 13px;
            color: var(--texto-suave);
            border-top: 2px solid var(--azul-suave);
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .contenedor { padding: 25px 16px; border-radius: 28px; }
            .encabezado h1 { font-size: 28px; }
            th, td { padding: 10px 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="contenedor">

        <a href="index.html" class="boton-regreso">← Volver al inicio</a>

        <div class="encabezado">
            <span class="dragon">🐉</span>
            <h1>Horarios de Específicos</h1>
            <div class="subtitulo">Ciclo 2026-2027</div>
        </div>

        <div id="contenido">
            <div class="estado">Cargando horarios...</div>
        </div>

        <div class="pie">
            Centro Cultural de la Niñez Yucateca · Ciclo 2026-2027
        </div>

    </div>

    <script>
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZq-TaatLsqJ2SleHhcpgoWZ3LLbHvh-vCvVuqyK0H0rlQAUfZWFON3abvTF1c7b5w5rvLKIeH6AaY/pub?gid=1714016319&single=true&output=csv';

        async function cargarHorarios() {
            const contenedor = document.getElementById('contenido');
            try {
                const respuesta = await fetch(URL_CSV);
                if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);

                const texto = await respuesta.text();
                const textoLimpio = texto.replace(/^\uFEFF/, '').trim();
                if (!textoLimpio) throw new Error('El CSV está vacío');

                const filas = parseCSV(textoLimpio);
                if (filas.length < 2) throw new Error('El CSV no tiene suficientes filas');

                const encabezados = filas[0].map(e => e.trim().toLowerCase());
                const idxBloque = encabezados.indexOf('bloque');
                const idxTaller = encabezados.indexOf('taller');
                const idxHora = encabezados.indexOf('hora');
                const idxDocente = encabezados.indexOf('docente');

                if (idxBloque === -1 || idxTaller === -1 || idxHora === -1 || idxDocente === -1) {
                    throw new Error('No se encontraron las columnas esperadas (Bloque, Taller, Hora, Docente)');
                }

                const datos = filas.slice(1).filter(f => f.length > 1 && f[idxBloque]?.trim());

                // Agrupar por bloque
                const bloques = {};
                datos.forEach(fila => {
                    const bloque = fila[idxBloque]?.trim() || '';
                    if (!bloque) return;
                    if (!bloques[bloque]) bloques[bloque] = [];
                    bloques[bloque].push({
                        taller: fila[idxTaller]?.trim() || '',
                        hora: fila[idxHora]?.trim() || '',
                        docente: fila[idxDocente]?.trim() || ''
                    });
                });

                const ordenBloques = ['Lunes y miércoles', 'Martes y jueves', 'Viernes'];
                const bloquesOrdenados = {};
                ordenBloques.forEach(nombre => {
                    if (bloques[nombre]) bloquesOrdenados[nombre] = bloques[nombre];
                });
                Object.keys(bloques).forEach(nombre => {
                    if (!bloquesOrdenados[nombre]) bloquesOrdenados[nombre] = bloques[nombre];
                });

                let html = '';
                for (const [nombreBloque, items] of Object.entries(bloquesOrdenados)) {
                    html += `<h2 class="bloque-titulo">${nombreBloque}</h2>`;
                    html += `<div class="tabla-wrapper"><table>`;
                    html += `<thead><tr><th>Taller</th><th>Hora</th><th>Docente</th></tr></thead><tbody>`;
                    items.forEach(item => {
                        html += `<tr>
                            <td class="taller">${item.taller}</td>
                            <td>${item.hora}</td>
                            <td class="docente">${item.docente}</td>
                        </tr>`;
                    });
                    html += `</tbody></table></div>`;
                }

                if (!html) throw new Error('No se encontraron datos para mostrar');

                contenedor.innerHTML = html;

            } catch (error) {
                contenedor.innerHTML = `<div class="estado error">
                    No se pudieron cargar los horarios.<br>
                    <small>Error: ${error.message}</small><br><br>
                    <small>Verifica que la URL del CSV sea correcta y que la hoja esté publicada como "Valores separados por comas".</small>
                </div>`;
                console.error('Error al cargar horarios:', error);
            }
        }

        function parseCSV(texto) {
            const filas = [];
            let fila = [];
            let celda = '';
            let entreComillas = false;

            for (let i = 0; i < texto.length; i++) {
                const c = texto[i];
                const siguiente = texto[i + 1];

                if (entreComillas) {
                    if (c === '"' && siguiente === '"') { celda += '"'; i++; }
                    else if (c === '"') { entreComillas = false; }
                    else { celda += c; }
                } else {
                    if (c === '"') { entreComillas = true; }
                    else if (c === ',') { fila.push(celda); celda = ''; }
                    else if (c === '\n' || (c === '\r' && siguiente === '\n')) {
                        if (c === '\r') i++;
                        fila.push(celda); celda = '';
                        if (fila.some(f => f.trim())) filas.push(fila);
                        fila = [];
                    } else if (c !== '\r') { celda += c; }
                }
            }
            if (celda || fila.length) {
                fila.push(celda);
                if (fila.some(f => f.trim())) filas.push(fila);
            }
            return filas;
        }

        cargarHorarios();
    </script>

</body>
</html>
