<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Materiales · CECUNY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --rojo-creatividad: #E63946;
            --rojo-suave: #FADBD8;
            --verde-integral: #2A9D8F;
            --verde-suave: #D1E7E4;
            --azul-especifico: #1D3557;
            --azul-suave: #D6E2F0;
            --acento: #6A4C93;
            --acento-suave: #E8DDF0;
            --acento-oscuro: #4A3468;
            --crema-fondo: #FFF9F2;
            --texto-principal: #3D2C2E;
            --texto-suave: #6B5B5D;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #F5EEF8 0%, #FFF9F2 100%);
            background-attachment: fixed;
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(106, 76, 147, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .boton-regreso {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--acento-suave);
            color: var(--acento-oscuro);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .boton-regreso:hover {
            background: var(--acento);
            color: white;
            transform: translateX(-4px);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }
        .encabezado .dragon {
            font-size: 45px;
            display: block;
            margin-bottom: 8px;
            animation: flotar 3s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .encabezado h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: var(--acento);
            margin-bottom: 6px;
        }
        .encabezado .subtitulo {
            font-size: 16px;
            color: var(--texto-suave);
            font-weight: 600;
            background: var(--acento-suave);
            display: inline-block;
            padding: 5px 18px;
            border-radius: 25px;
        }

        .nivel-titulo {
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            margin: 30px 0 12px 0;
            padding-left: 12px;
            border-left: 6px solid;
        }
        .nivel-titulo.creatividad { color: var(--rojo-creatividad); border-color: var(--rojo-creatividad); }
        .nivel-titulo.integral { color: var(--verde-integral); border-color: var(--verde-integral); }
        .nivel-titulo.especifico { color: var(--azul-especifico); border-color: var(--azul-especifico); }

        .tabla-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(106, 76, 147, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 15px;
        }

        thead { color: white; }
        .tabla-creatividad thead { background: var(--rojo-creatividad); }
        .tabla-integral thead { background: var(--verde-integral); }
        .tabla-especifico thead { background: var(--azul-especifico); }

        th {
            padding: 14px 12px;
            text-align: left;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #F0E6F5;
        }

        tbody tr:hover { background: #FAF5FC; }
        tbody tr:last-child td { border-bottom: none; }

        .cantidad {
            font-weight: 700;
            color: var(--acento-oscuro);
            text-align: center;
        }

        .estado {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
            font-weight: 600;
        }
        .estado.error { color: var(--acento); }

        .pie {
            margin-top: 35px;
            text-align: center;
            font-size: 13px;
            color: var(--texto-suave);
            border-top: 2px solid var(--acento-suave);
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .contenedor { padding: 25px 16px; border-radius: 28px; }
            .encabezado h1 { font-size: 28px; }
            .nivel-titulo { font-size: 20px; }
            th, td { padding: 10px 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="contenedor">

        <a href="index.html" class="boton-regreso">← Volver al inicio</a>

        <div class="encabezado">
            <span class="dragon">🐉</span>
            <h1>Lista de Materiales</h1>
            <div class="subtitulo">Ciclo 2026-2027</div>
        </div>

        <div id="contenido">
            <div class="estado">Cargando materiales...</div>
        </div>

        <div class="pie">
            Centro Cultural de la Niñez Yucateca · Ciclo 2026-2027
        </div>

    </div>

    <script>
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZq-TaatLsqJ2SleHhcpgoWZ3LLbHvh-vCvVuqyK0H0rlQAUfZWFON3abvTF1c7b5w5rvLKIeH6AaY/pub?gid=995249465&single=true&output=csv';

        async function cargarMateriales() {
            const contenedor = document.getElementById('contenido');
            try {
                const respuesta = await fetch(URL_CSV);
                if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);

                const texto = await respuesta.text();
                const textoLimpio = texto.replace(/^\uFEFF/, '').trim();
                if (!textoLimpio) throw new Error('El CSV está vacío');

                const filas = parseCSV(textoLimpio);
                if (filas.length < 2) throw new Error('El CSV no tiene suficientes filas');

                const encabezados = filas[0].map(e => e.trim().toLowerCase());
                const idxNivel = encabezados.indexOf('nivel');
                const idxMaterial = encabezados.indexOf('material');
                const idxCantidad = encabezados.indexOf('cantidad');

                if (idxNivel === -1 || idxMaterial === -1 || idxCantidad === -1) {
                    throw new Error('No se encontraron las columnas esperadas (Nivel, Material, Cantidad)');
                }

                const datos = filas.slice(1).filter(f => f.length > 1 && f[idxNivel]?.trim());

                // Agrupar por nivel
                const niveles = {};
                datos.forEach(fila => {
                    const nivel = fila[idxNivel]?.trim() || '';
                    if (!nivel) return;
                    if (!niveles[nivel]) niveles[nivel] = [];
                    niveles[nivel].push({
                        material: fila[idxMaterial]?.trim() || '',
                        cantidad: fila[idxCantidad]?.trim() || ''
                    });
                });

                const ordenNiveles = ['Creatividad', 'Integral', 'Específico'];
                const nivelesOrdenados = {};
                ordenNiveles.forEach(nombre => {
                    if (niveles[nombre]) nivelesOrdenados[nombre] = niveles[nombre];
                });
                Object.keys(niveles).forEach(nombre => {
                    if (!nivelesOrdenados[nombre]) nivelesOrdenados[nombre] = niveles[nombre];
                });

                let html = '';
                for (const [nombreNivel, items] of Object.entries(nivelesOrdenados)) {
                    const claseNivel = nombreNivel.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    html += `<h2 class="nivel-titulo ${claseNivel}">${nombreNivel}</h2>`;
                    html += `<div class="tabla-wrapper"><table class="tabla-${claseNivel}">`;
                    html += `<thead><tr><th>Material</th><th>Cantidad</th></tr></thead><tbody>`;
                    items.forEach(item => {
                        html += `<tr>
                            <td>${item.material}</td>
                            <td class="cantidad">${item.cantidad}</td>
                        </tr>`;
                    });
                    html += `</tbody></table></div>`;
                }

                if (!html) throw new Error('No se encontraron datos para mostrar');

                contenedor.innerHTML = html;

            } catch (error) {
                contenedor.innerHTML = `<div class="estado error">
                    No se pudieron cargar los materiales.<br>
                    <small>Error: ${error.message}</small><br><br>
                    <small>Verifica que la URL del CSV sea correcta y que la hoja esté publicada como "Valores separados por comas".</small>
                </div>`;
                console.error('Error al cargar materiales:', error);
            }
        }

        function parseCSV(texto) {
            const filas = [];
            let fila = [];
            let celda = '';
            let entreComillas = false;

            for (let i = 0; i < texto.length; i++) {
                const c = texto[i];
                const siguiente = texto[i + 1];

                if (entreComillas) {
                    if (c === '"' && siguiente === '"') { celda += '"'; i++; }
                    else if (c === '"') { entreComillas = false; }
                    else { celda += c; }
                } else {
                    if (c === '"') { entreComillas = true; }
                    else if (c === ',') { fila.push(celda); celda = ''; }
                    else if (c === '\n' || (c === '\r' && siguiente === '\n')) {
                        if (c === '\r') i++;
                        fila.push(celda); celda = '';
                        if (fila.some(f => f.trim())) filas.push(fila);
                        fila = [];
                    } else if (c !== '\r') { celda += c; }
                }
            }
            if (celda || fila.length) {
                fila.push(celda);
                if (fila.some(f => f.trim())) filas.push(fila);
            }
            return filas;
        }

        cargarMateriales();
    </script>

</body>
</html>
