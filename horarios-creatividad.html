<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Creatividad · CECUNY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --rojo-creatividad: #E63946;
            --rojo-suave: #FADBD8;
            --rojo-oscuro: #A4161A;
            --crema-fondo: #FFF9F2;
            --texto-principal: #3D2C2E;
            --texto-suave: #6B5B5D;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #FADBD8 0%, #FCE8D8 50%, #FFF9F2 100%);
            background-attachment: fixed;
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(180, 80, 60, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        /* --- Botón de regreso --- */
        .boton-regreso {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--rojo-suave);
            color: var(--rojo-oscuro);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .boton-regreso:hover {
            background: var(--rojo-creatividad);
            color: white;
            transform: translateX(-4px);
        }

        /* --- Encabezado --- */
        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }
        .encabezado .dragon {
            font-size: 45px;
            display: block;
            margin-bottom: 8px;
            animation: flotar 3s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .encabezado h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: var(--rojo-creatividad);
            margin-bottom: 6px;
        }
        .encabezado .subtitulo {
            font-size: 16px;
            color: var(--texto-suave);
            font-weight: 600;
            background: var(--rojo-suave);
            display: inline-block;
            padding: 5px 18px;
            border-radius: 25px;
        }

        /* --- Tablas --- */
        .bloque-titulo {
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            color: var(--rojo-oscuro);
            margin: 30px 0 12px 0;
            padding-left: 12px;
            border-left: 6px solid var(--rojo-creatividad);
        }

        .tabla-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(180, 80, 60, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 15px;
        }

        thead {
            background: var(--rojo-creatividad);
            color: white;
        }

        th {
            padding: 14px 12px;
            text-align: left;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #FCE4E4;
        }

        tbody tr:hover {
            background: #FFF5F5;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .docente {
            font-weight: 600;
            color: var(--rojo-oscuro);
        }

        .cupo {
            text-align: center;
            font-weight: 700;
            color: var(--texto-suave);
        }

        /* --- Loading / Error --- */
        .estado {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
            font-weight: 600;
        }
        .estado.error {
            color: var(--rojo-creatividad);
        }

        /* --- Pie --- */
        .pie {
            margin-top: 35px;
            text-align: center;
            font-size: 13px;
            color: var(--texto-suave);
            border-top: 2px solid var(--rojo-suave);
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .contenedor { padding: 25px 16px; border-radius: 28px; }
            .encabezado h1 { font-size: 28px; }
            th, td { padding: 10px 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="contenedor">

        <a href="index.html" class="boton-regreso">← Volver al inicio</a>

        <div class="encabezado">
            <span class="dragon">🐉</span>
            <h1>Horarios de Creatividad</h1>
            <div class="subtitulo">Ciclo 2026-2027</div>
        </div>

        <div id="contenido">
            <div class="estado">Cargando horarios...</div>
        </div>

        <div class="pie">
            Centro Cultural de la Niñez Yucateca · Ciclo 2026-2027
        </div>

    </div>

    <script>
        // ⚠️ REEMPLAZA ESTA URL CON LA QUE TE DIO GOOGLE SHEETS
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZq-TaatLsqJ2SleHhcpgoWZ3LLbHvh-vCvVuqyK0H0rlQAUfZWFON3abvTF1c7b5w5rvLKIeH6AaY/pub?gid=0&single=true&output=csv';

        async function cargarHorarios() {
            const contenedor = document.getElementById('contenido');
            try {
                const respuesta = await fetch(URL_CSV);
                if (!respuesta.ok) throw new Error('No se pudo cargar');
                const texto = await respuesta.text();
                const filas = parseCSV(texto);

                if (filas.length < 2) throw new Error('Sin datos');

                const encabezados = filas[0];
                const datos = filas.slice(1).filter(f => f.length > 1 && f[0].trim());

                // Agrupar por bloque
                const bloques = {};
                datos.forEach(fila => {
                    const bloque = fila[0].trim();
                    if (!bloques[bloque]) bloques[bloque] = [];
                    bloques[bloque].push({
                        hora: fila[1]?.trim() || '',
                        grupo: fila[2]?.trim() || '',
                        docente: fila[3]?.trim() || '',
                        cupo: fila[4]?.trim() || ''
                    });
                });

                const nombresBloque = { LM: 'Lunes y Miércoles', MJ: 'Martes y Jueves', V: 'Viernes' };

                let html = '';
                for (const [clave, nombre] of Object.entries(nombresBloque)) {
                    if (!bloques[clave] || bloques[clave].length === 0) continue;
                    html += `<h2 class="bloque-titulo">${nombre}</h2>`;
                    html += `<div class="tabla-wrapper"><table>`;
                    html += `<thead><tr><th>Hora</th><th>Grupo</th><th>Docente</th><th>Cupo</th></tr></thead><tbody>`;
                    bloques[clave].forEach(item => {
                        html += `<tr>
                            <td>${item.hora}</td>
                            <td>${item.grupo}</td>
                            <td class="docente">${item.docente}</td>
                            <td class="cupo">${item.cupo}</td>
                        </tr>`;
                    });
                    html += `</tbody></table></div>`;
                }

                contenedor.innerHTML = html;

            } catch (error) {
                contenedor.innerHTML = `<div class="estado error">No se pudieron cargar los horarios. Verifica la conexión o la URL de Google Sheets.</div>`;
                console.error(error);
            }
        }

        // Parser CSV simple
        function parseCSV(texto) {
            const filas = [];
            let fila = [];
            let celda = '';
            let entreComillas = false;

            for (let i = 0; i < texto.length; i++) {
                const c = texto[i];
                const siguiente = texto[i + 1];

                if (entreComillas) {
                    if (c === '"' && siguiente === '"') { celda += '"'; i++; }
                    else if (c === '"') { entreComillas = false; }
                    else { celda += c; }
                } else {
                    if (c === '"') { entreComillas = true; }
                    else if (c === ',') { fila.push(celda); celda = ''; }
                    else if (c === '\n' || (c === '\r' && siguiente === '\n')) {
                        if (c === '\r') i++;
                        fila.push(celda); celda = '';
                        if (fila.some(f => f.trim())) filas.push(fila);
                        fila = [];
                    } else if (c !== '\r') { celda += c; }
                }
            }
            if (celda || fila.length) { fila.push(celda); if (fila.some(f => f.trim())) filas.push(fila); }
            return filas;
        }

        cargarHorarios();
    </script>

</body>
</html>
