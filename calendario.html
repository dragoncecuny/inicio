<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario · CECUNY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --rojo-creatividad: #E63946;
            --verde-integral: #2A9D8F;
            --azul-especifico: #1D3557;
            --morado-acento: #6A4C93;
            --morado-suave: #E8DDF0;
            --morado-oscuro: #4A3468;
            --crema-fondo: #FFF9F2;
            --texto-principal: #3D2C2E;
            --texto-suave: #6B5B5D;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #E8DDF0 0%, #F5EEF8 50%, #FFF9F2 100%);
            background-attachment: fixed;
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Manchas de color de fondo (rojo, verde, azul) */
        body::before {
            content: '';
            position: fixed;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(42, 157, 143, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(106, 76, 147, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
        }

        .boton-regreso {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--morado-suave);
            color: var(--morado-oscuro);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .boton-regreso:hover {
            background: var(--morado-acento);
            color: white;
            transform: translateX(-4px);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }
        .encabezado .dragon {
            font-size: 45px;
            display: block;
            margin-bottom: 8px;
            animation: flotar 3s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .encabezado h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: var(--morado-acento);
            margin-bottom: 6px;
        }
        .encabezado .subtitulo {
            font-size: 16px;
            color: var(--texto-suave);
            font-weight: 600;
            background: var(--morado-suave);
            display: inline-block;
            padding: 5px 18px;
            border-radius: 25px;
        }

        /* --- MARCO DECORATIVO DEL CALENDARIO --- */
        .calendario-marco {
            position: relative;
            padding: 12px;
            border-radius: 30px;
            /* Borde con los colores de los niveles (degradado) */
            background: linear-gradient(135deg, 
                var(--rojo-creatividad) 0%, 
                var(--rojo-creatividad) 30%, 
                var(--verde-integral) 30%, 
                var(--verde-integral) 60%, 
                var(--azul-especifico) 60%, 
                var(--azul-especifico) 100%
            );
            box-shadow: 0 10px 30px rgba(106, 76, 147, 0.2);
        }

        /* Capa interna blanca para que el calendario respire */
        .calendario-wrapper {
            background: white;
            border-radius: 24px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Dragones decorativos en las esquinas del marco */
        .calendario-marco::before {
            content: '🐉';
            position: absolute;
            top: -10px;
            left: -10px;
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            transform: rotate(-20deg);
            z-index: 2;
        }
        .calendario-marco::after {
            content: '🐉';
            position: absolute;
            bottom: -10px;
            right: -10px;
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            transform: rotate(20deg) scaleX(-1);
            z-index: 2;
        }

        .calendario-wrapper iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 16px;
            display: block;
        }

        /* Detalle: cinta decorativa arriba del calendario */
        .cinta-decorativa {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .cinta-decorativa span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .cinta-decorativa .rojo { background: var(--rojo-creatividad); }
        .cinta-decorativa .verde { background: var(--verde-integral); }
        .cinta-decorativa .azul { background: var(--azul-especifico); }

        .nota {
            margin-top: 20px;
            font-size: 13px;
            color: var(--texto-suave);
            text-align: center;
            font-style: italic;
        }

        .pie {
            margin-top: 35px;
            text-align: center;
            font-size: 13px;
            color: var(--texto-suave);
            border-top: 2px solid var(--morado-suave);
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .contenedor { padding: 25px 16px; border-radius: 28px; }
            .encabezado h1 { font-size: 28px; }
            .calendario-marco { padding: 8px; }
            .calendario-wrapper { padding: 10px; }
            .calendario-wrapper iframe { height: 450px; }
        }
    </style>
</head>
<body>

    <div class="contenedor">

        <a href="index.html" class="boton-regreso">← Volver al inicio</a>

        <div class="encabezado">
            <span class="dragon">🐉</span>
            <h1>Calendario</h1>
            <div class="subtitulo">Ciclo 2026-2027</div>
        </div>

        <!-- Puntos decorativos con los colores de los niveles -->
        <div class="cinta-decorativa">
            <span class="rojo"></span>
            <span class="verde"></span>
            <span class="azul"></span>
        </div>

        <!-- Marco decorativo del calendario -->
        <div class="calendario-marco">
            <div class="calendario-wrapper">
                <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=America%2FMexico_City&showNav=0&mode=MONTH&src=Y2VjdW55Y29vcmRpbmFjaW9uYWNhZGVtaWNhQGdtYWlsLmNvbQ&color=%23009688" 
                        width="100%" 
                        height="600" 
                        frameborder="0" 
                        scrolling="no">
                </iframe>
            </div>
        </div>

        <div class="nota">
            * Este calendario se actualiza automáticamente. Para ver los detalles de un evento, haz clic sobre él.
        </div>

        <div class="pie">
            Centro Cultural de la Niñez Yucateca · Ciclo 2026-2027
        </div>

    </div>

</body>
</html>
